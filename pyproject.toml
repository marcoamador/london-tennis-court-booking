[project]
name = "courtwatch"
version = "0.1.0"
description = "Tennis court availability tracker and cancellation alerts for East London venues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "jinja2>=3.1",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.2",
    "aiosmtplib>=3.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI dependencies (Depends/Form/Query) are meant to be called in defaults;
# long SQL/URL strings are clearer unwrapped.
ignore = ["B008", "E501"]

[tool.uv]
package = false
