# CourtWatch behind an existing host nginx.
# Install:  sudo cp deploy/nginx/courtwatch.conf /etc/nginx/sites-available/courtwatch
#           sudo ln -s /etc/nginx/sites-available/courtwatch /etc/nginx/sites-enabled/courtwatch
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d 94-130-138-168.sslip.io   # adds the HTTPS (443) block + redirect
# Only requests for this hostname reach CourtWatch; your other nginx sites are untouched.

server {
    listen 80;
    listen [::]:80;
    server_name 94-130-138-168.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
