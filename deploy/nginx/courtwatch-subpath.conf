# CourtWatch under a subpath of an existing nginx site, e.g. https://your-host/tennis/
# (next to other apps such as /stocks). Paste these two blocks INSIDE that site's existing
# `server { ... }` block (the one with `listen 443 ssl` and its certificate), then:
#     sudo nginx -t && sudo systemctl reload nginx
# In /opt/courtwatch/.env set:  ROOT_PATH=/tennis   BASE_URL=https://your-host/tennis

location = /tennis {
    return 301 /tennis/;
}

location /tennis/ {
    # The trailing slash strips /tennis before forwarding, so the app sees /, /alerts, ...
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /tennis;
    proxy_read_timeout 60s;
}
