{% extends "base.html" %}
{% block title %}Sign in · CourtWatch{% endblock %}
{% block content %}
<section class="card narrow">
  <div class="card-body">
    <h1>Sign in</h1>
    <p class="muted">CourtWatch is invite-only. Enter your email and we'll send you a sign-in link.</p>
    <form method="post" action="/login">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" placeholder="you@example.com" required autofocus autocomplete="email">
      </div>
      <button class="btn block" type="submit">Email me a link</button>
    </form>
  </div>
</section>
{% endblock %}
