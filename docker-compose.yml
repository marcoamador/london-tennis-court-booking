services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /data/courtwatch.db
    volumes:
      - data:/data
    # Only reachable from the host itself; a reverse proxy (host nginx, or the optional caddy
    # service below) is what faces the internet.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    restart: unless-stopped

  # Optional: for a server with nothing on ports 80/443. Enable with COMPOSE_PROFILES=caddy in .env.
  caddy:
    image: caddy:2
    profiles: [caddy]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
